<!DOCTYPE html>
<html lang="en">
<head>
<script data-parris-ga4="opt-in">
/* GA4: explicit opt-in; no advertising, custom events or URL parameters. */
(() => {
  if (window.__parrisGA4Consent) return;
  window.__parrisGA4Consent = true;
  const id = 'G-LV0CW7PHH0';
  const key = 'ga4-consent';
  const blocked = navigator.globalPrivacyControl === true || navigator.doNotTrack === '1' || window.doNotTrack === '1';
  window['ga-disable-' + id] = true;
  if (blocked) return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
  const consent = value => ({analytics_storage:value, ad_storage:'denied', ad_user_data:'denied', ad_personalization:'denied'});
  window.gtag('consent', 'default', consent('denied'));
  let loaded = false;
  let panel;
  const safePage = () => ({page_location:location.origin + location.pathname, page_referrer:'', page_title:'SwordCoast'});
  function choose(choice) {
    try { localStorage.setItem(key, choice); } catch { /* Choice still applies to this page. */ }
    const allowed = choice === 'granted';
    window['ga-disable-' + id] = !allowed;
    window.gtag('consent', 'update', consent(allowed ? 'granted' : 'denied'));
    if (panel) panel.hidden = true;
    if (!allowed || loaded) return;
    loaded = true;
    window.gtag('set', {...safePage(), allow_google_signals:false, allow_ad_personalization_signals:false, url_passthrough:false});
    window.gtag('js', new Date());
    window.gtag('config', id, {...safePage(), cookie_expires:7776000, cookie_update:false, allow_google_signals:false, allow_ad_personalization_signals:false});
    const script = document.createElement('script');
    script.async = true;
    script.referrerPolicy = 'no-referrer';
    script.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
    document.head.appendChild(script);
  }
  function setup() {
    panel = document.createElement('aside');
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-label', 'Analytics and privacy');
    panel.style.cssText = 'position:fixed;bottom:48px;left:12px;right:12px;max-width:650px;padding:16px;background:#fff;color:#111;border:2px solid #555;border-radius:8px;z-index:2147483647;font:16px/1.5 system-ui;box-shadow:0 2px 12px #0006';
    const text = document.createElement('p');
    text.textContent = 'Allow Google Analytics to measure visits? Google receives page views and device/location estimates and uses first-party _ga cookies for up to 90 days. No advertising, names, form contents, search text or custom user IDs are sent. URL queries, fragments and referrers are omitted. Decline to keep analytics off; change your choice using Analytics settings. Global Privacy Control and Do Not Track keep Google Analytics off.';
    panel.appendChild(text);
    for (const [label, value] of [['Allow analytics', 'granted'], ['Decline', 'denied']]) {
      const button = document.createElement('button');
      button.type = 'button'; button.textContent = label;
      button.style.cssText = 'margin:4px;padding:8px 12px;background:#eee;color:#111;border:1px solid #555;border-radius:4px;font:inherit;cursor:pointer';
      button.addEventListener('click', () => choose(value));
      panel.appendChild(button);
    }
    const settings = document.createElement('button');
    settings.type = 'button'; settings.textContent = 'Analytics settings';
    settings.style.cssText = 'position:fixed;bottom:8px;left:12px;z-index:2147483646;padding:6px 10px;background:#fff;color:#111;border:1px solid #555;border-radius:4px;font:14px system-ui;cursor:pointer';
    settings.addEventListener('click', () => {panel.hidden = false; panel.querySelector('button').focus();});
    document.body.appendChild(panel);
    document.body.appendChild(settings);
    let saved;
    try { saved = localStorage.getItem(key); } catch { /* Ask again without storage. */ }
    if (saved === 'granted' || saved === 'denied') choose(saved);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup, {once:true});
  else setup();
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronicles of the Sword Coast</title>
<link rel="stylesheet" href="./styles/main.css">
</head>
<body>
<div id="app">
  <div id="title-screen">
    <div class="title-main">Chronicles of the Sword Coast</div>
    <div class="title-sub">A Fantasy Browser RPG</div>
    <div class="title-divider"></div>
    <div class="title-buttons">
      <button class="btn btn-primary btn-lg" id="new-game-btn">New Adventure</button>
      <button class="btn btn-lg" id="load-btn" style="display:none">Continue Journey</button>
      <button class="btn btn-lg" id="title-tutorial-btn">Tutorial</button>
    </div>
    <div class="title-flavor">New to the game? Open <strong>Tutorial</strong> first—it explains every part of the screen.</div>
  </div>

  <div id="char-creation"></div>

  <div id="game-screen">
    <div class="game-header">
      <div class="location-display" id="location-name">Protector's Enclave, Neverwinter</div>
      <div class="char-brief" id="char-brief"></div>
      <div class="header-btns">
        <button class="btn btn-sm" id="toggle-sidebar-btn">Sheet</button>
        <button class="btn btn-sm" id="rest-btn">Rest</button>
        <button class="btn btn-sm" id="save-btn">Save</button>
        <button class="btn btn-sm" id="help-btn">Help</button>
      </div>
    </div>

    <div class="game-body">
      <div class="game-main">
        <div class="scene-panel" id="scene-illustration">
          <img id="scene-image" class="scene-image" src="./assets/scenes/default.svg" alt="Current location" width="640" height="200" decoding="async" />
          <div class="scene-caption" id="scene-caption"></div>
        </div>
        <div class="narrative-panel" id="narrative-panel">
          <div class="narrative-text" id="narrative"></div>
        </div>
        <div class="action-panel">
          <div class="actions" id="actions"></div>
        </div>
      </div>

      <aside class="game-sidebar" id="sidebar">
        <div class="sidebar-tabs" id="sidebar-tabs">
          <div class="sidebar-tab active" data-tab="character">Character</div>
          <div class="sidebar-tab" data-tab="party">Party</div>
          <div class="sidebar-tab" data-tab="inventory">Inventory</div>
          <div class="sidebar-tab" data-tab="quests">Quests</div>
          <div class="sidebar-tab" data-tab="spells">Spells</div>
          <div class="sidebar-tab" data-tab="log">Log</div>
          <div class="sidebar-tab" data-tab="help">Help</div>
        </div>
        <div class="sidebar-content">
          <div class="sidebar-panel active" id="panel-character"></div>
          <div class="sidebar-panel" id="panel-party"></div>
          <div class="sidebar-panel" id="panel-inventory"></div>
          <div class="sidebar-panel" id="panel-quests"></div>
          <div class="sidebar-panel" id="panel-spells"></div>
          <div class="sidebar-panel" id="panel-log"></div>
          <div class="sidebar-panel" id="panel-help"></div>
        </div>
      </aside>
    </div>
  </div>

  <div id="tutorial-modal" class="modal-overlay tutorial-overlay" aria-hidden="true">
    <div class="tutorial-panel" role="dialog" aria-labelledby="tutorial-step-title">
      <h2 class="tutorial-step-title" id="tutorial-step-title"></h2>
      <div class="tutorial-step-body" id="tutorial-step-body"></div>
      <div class="tutorial-progress" id="tutorial-progress"></div>
      <div class="tutorial-nav">
        <button type="button" class="btn" id="tutorial-prev">Back</button>
        <button type="button" class="btn btn-primary" id="tutorial-next">Next</button>
        <button type="button" class="btn" id="tutorial-close-footer">Close</button>
      </div>
    </div>
  </div>

  <div id="world-map-modal" class="modal-overlay world-map-overlay" aria-hidden="true">
    <div class="world-map-panel">
      <h2 class="world-map-title">Neverwinter &amp; Environs</h2>
      <p class="world-map-hint" id="world-map-hint"></p>
      <div class="world-map-canvas">
        <svg id="world-map-svg" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        <div id="world-map-nodes" class="world-map-nodes"></div>
      </div>
      <div class="world-map-footer">
        <button type="button" class="btn" id="world-map-close">Close</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
<script src="./podcast-player.js?v=3" defer></script>
  <script src="https://parris-tech-services.github.io/WhirringWilderness/network/parris-network.js?v=2.1"></script>
</body>
</html>
